// ---------------------------------------------------------------------
// Live DONKI fetch (NASA Open APIs). Falls back to ARCHIVED data.
// ---------------------------------------------------------------------
const SpaceWeather = {
  status: "idle", // idle | loading | live | archived
  flares: [],
  strongest: null,
  fetchedAt: null,
  async load() {
    if (this.status === "loading" || this.status === "live") return;
    this.status = "loading";
    const end = new Date();
    const start = new Date(end.getTime() - 30 * 86400000);
    const f = (d) => d.toISOString().slice(0, 10);
    const url = `https://api.nasa.gov/DONKI/FLR?startDate=${f(start)}&endDate=${f(end)}&api_key=${CONFIG.NASA_API_KEY}`;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error("bad data");
      this.flares = data
        .filter((x) => x && x.classType)
        .map((x) => ({ classType: x.classType, peakTime: x.peakTime || x.beginTime, link: x.link }))
        .sort((a, b) => (a.peakTime < b.peakTime ? 1 : -1));
      this.status = "live";
      this.fetchedAt = new Date();
    } catch (e) {
      this.flares = ARCHIVED_SPACE_WEATHER.flares.slice();
      this.status = "archived";
    }
    this.strongest = this.flares.reduce((best, x) => (!best || flareValue(x.classType) > flareValue(best.classType) ? x : best), null);
  },
  // risk level from the last 7 days (live) or the archived record
  risk() {
    let list = this.flares;
    if (this.status === "live") {
      const cut = Date.now() - 7 * 86400000;
      list = list.filter((x) => new Date(x.peakTime).getTime() >= cut);
    }
    const s = list.reduce((b, x) => Math.max(b, flareValue(x.classType)), 0);
    if (s >= 1e-4) return "X";
    if (s >= 1e-5) return "M";
    return "quiet";
  },
};
function flareValue(c) {
  if (!c) return 0;
  const m = { A: 1e-8, B: 1e-7, C: 1e-6, M: 1e-5, X: 1e-4 }[c[0]] || 0;
  return m * (parseFloat(c.slice(1)) || 1);
}

    if (s.beard) { H(5, 9, 2, 3, s.hair); H(15, 9, 2, 3, s.hair); H(6, 11, 10, 2, s.hair); H(7, 13, 8, 1, s.hair); H(9 + lx, 10, 4, 1, s.hair); H(10 + lx, 11, 2, 1, "#9c4e46"); [7, 11, 14].forEach((x) => H(x, 12, 1, 1, s.hairH)); H(5, 9, 1, 1, s.hairH); H(16, 9, 1, 1, s.hairH); }
    else if (s.mustache) { H(8 + lx, 10, 6, 1, s.hair); H(10 + lx, 11, 2, 1, "#9c4e46"); }
    else { H(10 + lx, 11, 2, 1, "#9c4e46"); H(9 + lx, 10, 1, 1, s.skinS); }
  } else if (side) {
    if (blink) H(6, 8, 2, 1, V2.eye); else { H(6, 6, 2, 3, V2.eye); H(6, 8, 2, 1, iris); H(6, 6, 1, 1, V2.white); }
    H(6, 5, 3, 1, s.style === "hijab" ? "#3a2a22" : s.hairS);
    H(4, 8, 1, 2, s.skin); H(4, 10, 1, 1, s.skinS); // nose
    H(7, 9, 2, 1, s.blush);
    if (s.glasses) { const gc = "#0e1018"; H(5, 5, 4, 1, gc); H(5, 9, 4, 1, gc); H(5, 5, 1, 5, gc); H(8, 5, 1, 5, gc); H(9, 6, 3, 1, gc); }
    if (s.beard) { H(5, 10, 7, 3, s.hair); H(10, 7, 2, 4, s.hair); H(6, 13, 5, 1, s.hair); H(5, 11, 2, 1, "#9c4e46"); H(7, 12, 1, 1, s.hairH); }
    else if (s.mustache) { H(4, 10, 4, 1, s.hair); H(5, 11, 2, 1, "#9c4e46"); }
    else H(5, 11, 2, 1, "#9c4e46");
  }
  // ------------------------------------------------ side front arm (on top)
  if (side) {
    const dx = Math.round(swing * 2);
    if (s.tablet) { T(8, 15, 3, 4, V2.suit); T(6, 18, 3, 2, V2.suit); T(3, 16, 4, 6, "#26304a"); T(4, 17, 2, 4, gest ? "#8fe0ff" : "#4fa8f0"); hand(5, 19); }
    else { T(9 + dx, 15, 3, 6, V2.suit); T(9 + dx, 15, 1, 6, V2.suitL); T(9 + dx, 20, 3, 1, s.stripe); hand(9 + dx, 21); }
  }
  // ------------------------------------------------ helmet (outside)
  if (pose.helmet) {
    g.fillStyle = "rgba(170,220,255,0.26)"; g.beginPath(); g.ellipse(12, 8 + hb, 10, 9.5, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#e6eef8"; g.lineWidth = 1; g.beginPath(); g.ellipse(12, 8.5 + hb, 9.5, 9, 0, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "rgba(255,255,255,0.75)"; g.fillRect(5, 3 + hb, 3, 1); g.fillRect(4, 4 + hb, 1, 3);
    g.fillStyle = V2.grey; g.fillRect(4, 16 + hb, 16, 1);
  }
  return outlineColored(cv);
}

const CharSprites2 = {};
function buildCharSprites2() {
  for (const id in CHAR_SPECS) for (const helmet of [false, true]) {
    const set = { walk: [], idle: [], look: [], gest: [] };
    for (let dir = 0; dir < 4; dir++) {
      const d = dir === 3 ? 2 : dir;
      const mk = (pose) => { let c = drawCharV2(id, { ...pose, dir: d, helmet }); if (dir === 3) { const m = mkCanvas(c.width, c.height), mg = m.getContext("2d"); mg.translate(c.width, 0); mg.scale(-1, 1); mg.drawImage(c, 0, 0); c = m; } return c; };
      set.walk[dir] = []; for (let f = 0; f < 8; f++) set.walk[dir].push([mk({ f, blink: false }), mk({ f, blink: true })]);
      set.idle[dir] = []; for (let b = 0; b < 2; b++) set.idle[dir].push([mk({ f: -1, breath: b, blink: false }), mk({ f: -1, breath: b, blink: true })]);
      if (dir === 0) { set.look = [-1, 1].map((l) => mk({ f: -1, breath: 0, blink: false, look: l })); set.gest = [1, 2].map((gs) => mk({ f: -1, breath: 0, blink: false, gest: gs })); }
    }
    CharSprites2[id + (helmet ? "_h" : "")] = set;
  }
}

// draw with the v2 set: walk frame follows distance walked (no foot sliding), idle breathes,
// NPCs glance around and do their own gesture now and then
function drawCharacterV2(g, c, t) {
  const set = CharSprites2[c.sprite + (c.helmet ? "_h" : "")]; if (!set) return;
  const blink = (t + c.blinkOff) % 3.7 < 0.13;
  let img;
  if (c.moving) {
    const f = Math.floor((c.walkDist || 0) / 4) % 8;
    img = set.walk[c.dir][f][blink ? 1 : 0];
  } else {
    const breath = Math.sin(t * 2.2 + c.blinkOff) > 0.35 ? 1 : 0;
    img = set.idle[c.dir][breath][blink ? 1 : 0];
    if (c.dir === 0 && c !== Game.player && !c.follow) {
      const cyc = (t + c.blinkOff * 3) % 9;
      if (cyc > 3 && cyc < 4.2) img = set.look[0];
      else if (cyc > 4.2 && cyc < 5.2) img = set.look[1];
      else if (cyc > 6.5 && cyc < 8.3) img = set.gest[c.sprite === "diego" ? (((t * 6) | 0) % 2) : 0];
    } else if (c.dir === 0 && c === Game.player && (c.idleT || 0) > 5) img = set.gest[0]; // hands on hips after standing still
  }
  // soft shadow
  g.fillStyle = "rgba(0,0,0,0.3)"; g.beginPath(); g.ellipse(Math.round(c.x), Math.round(c.y) - 1, 7, 2.8, 0, 0, 7); g.fill();
  g.drawImage(img, Math.round(c.x - 12), Math.round(c.y - 33));
  if (c.hurt) { const x = Math.round(c.x) + 5, y = Math.round(c.y) - 13; g.fillStyle = "#fff"; g.fillRect(x, y, 3, 3); g.fillStyle = "#e04040"; g.fillRect(x + 1, y, 1, 3); g.fillRect(x, y + 1, 3, 1); }
}

// ---- teamchars.js ----
// =====================================================================
//  TEAM CHARACTERS — the team's own sprite sheets (teamsprites.js).
//  Default character style. Walk frames follow distance walked; idle
//  characters breathe; the outside helmet is drawn on top in code.
// =====================================================================
const TeamSheets = {};
(function loadTeamSheets() {
  for (const id in TEAM_SPRITES) {
    const d = TEAM_SPRITES[id], img = new Image(), por = new Image();
    TeamSheets[id] = { img, por, w: d.w, h: d.h, ready: false, porCanvas: null };
    img.onload = () => { TeamSheets[id].ready = true; };
    por.onload = () => { const c = mkCanvas(42, 42); c.getContext("2d").drawImage(por, 1, 1); TeamSheets[id].porCanvas = c; };
    img.src = d.atlas; por.src = d.portrait;
  }
})();
const TEAM_ROW = [0, 3, 1, 2]; // game dir (down, up, left, right) -> sheet row

function drawCharacterTeam(g, c, t) {
  const S = TeamSheets[c.sprite]; if (!S || !S.ready) return drawCharacterV2(g, c, t);
  const row = TEAM_ROW[c.dir] ?? 0;
  const col = c.moving ? Math.floor((c.walkDist || 0) / 6) % 4 : (row === 1 || row === 2 ? 3 : 0); // side rows: column 3 is the closest to standing
  const x = Math.round(c.x - S.w / 2), y = Math.round(c.y - S.h + 1);
  // shadow
  g.fillStyle = "rgba(0,0,0,0.32)"; g.beginPath(); g.ellipse(Math.round(c.x), Math.round(c.y) - 1, 8, 3, 0, 0, 7); g.fill();
  // idle breathing: the upper body rises 1 px now and then
  const breathe = !c.moving && Math.sin(t * 2.2 + c.blinkOff) > 0.4;
  if (breathe) {
    const cut = Math.round(S.h * 0.62);
    g.drawImage(S.img, col * S.w, row * S.h + cut, S.w, S.h - cut, x, y + cut, S.w, S.h - cut);
    g.drawImage(S.img, col * S.w, row * S.h, S.w, cut, x, y - 1, S.w, cut + 1);
  } else g.drawImage(S.img, col * S.w, row * S.h, S.w, S.h, x, y, S.w, S.h);
  if (c.helmet) {
    const hx = Math.round(c.x), hy = y + 9;
    g.fillStyle = "rgba(170,220,255,0.24)"; g.beginPath(); g.ellipse(hx, hy, 10, 10, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#e6eef8"; g.lineWidth = 1; g.beginPath(); g.ellipse(hx, hy, 10, 10, 0, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = "#1b1d2b"; g.beginPath(); g.ellipse(hx, hy, 11, 11, 0, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "rgba(255,255,255,0.8)"; g.fillRect(hx - 7, hy - 6, 3, 1); g.fillRect(hx - 8, hy - 5, 1, 3);
  }
  if (c.hurt) { const hx = Math.round(c.x) + 5, hy = Math.round(c.y) - 16; g.fillStyle = "#fff"; g.fillRect(hx, hy, 3, 3); g.fillStyle = "#e04040"; g.fillRect(hx + 1, hy, 1, 3); g.fillRect(hx, hy + 1, 3, 1); }
}
// portrait for dialogue / cards (team art when that style is on)
function portraitFor(id, blink, talk, mood) {
  if (CHAR_STYLE === "team" && TeamSheets[id] && TeamSheets[id].porCanvas) return TeamSheets[id].porCanvas;
  return getPortrait(id, blink, talk, mood);
}
function charHeadOffset() { return CHAR_STYLE === "team" ? 46 : CHAR_STYLE === "v2" ? 43 : 34; }

// ---- emotions.js ----
// =====================================================================
//  EMOTIONS — portraits show how the speaker feels.
//  Moods: calm, happy, worried, scared, sad, angry, hurt.
//  • Team portraits get their mouth + eyebrows redrawn per mood.
//  • Every style gets a small animated emote (sweat drop, anger mark…).
//  • The mood is picked from the line (or set explicitly with {mood}).
// =====================================================================
const MOODS = ["calm", "happy", "worried", "scared", "sad", "angry", "hurt"];
// face landmarks in the 40x40 team portrait (drawn at +1,+1 in a 42 canvas)
const TEAM_FACE = {
  lead:   { skin: [20, 28], mouth: [18, 21, 31, 32], brow: [[12, 17], [23, 28]], by: 21, browC: "#7a5420", smile: false },
  layla:  { skin: [20, 27], mouth: [16, 21, 29, 30], brow: [[13, 17], [23, 27]], by: 18, browC: "#4a2e22", smile: true },
  marcus: { skin: [20, 27], mouth: [17, 24, 33, 33], brow: [[12, 17], [24, 29]], by: 18, browC: "#1e1612", smile: false },
  diego:  { skin: [20, 29], mouth: null, under: [18, 25, 33], brow: [[12, 17], [23, 28]], by: 22, browC: "#1e1612", smile: false },
};
const _moodCache = {};
function moodPortrait(id, blink, talk, mood) {
  mood = MOODS.includes(mood) ? mood : mood === 1 ? "angry" : "calm";
  if (!(CHAR_STYLE === "team" && TeamSheets[id] && TeamSheets[id].porCanvas && TEAM_FACE[id])) {
    // code-drawn portraits: mood 1 = serious face (no smile); smile only when happy
    return getPortrait(id, blink, talk, mood === "happy" ? 0 : 1);

  if (_moodCache[key]) return _moodCache[key];

  // ------------------------------------------------------------ dialogue
  say(who, text, opts = {}) {

        if (done) return;
        i += 1;

function makeChar(id, sprite, tx, ty) { return { id, sprite, x: tx * T + 8, y: ty * T + 12, dir: 0, moving: false, walkT: 0, blinkOff: Math.random() * 4, visible: true, path: null, speed: 52, follow: null, helmet: false, hurt: false }; }

const Game = {
  chars: [], player: null, npc: {}, interactables: [], mode: "boot", room: null, target: null, guidePath: null, guideT: 0,
  keys: {}, joy: { x: 0, y: 0 }, trail: [], lastStepSound: 0, onRoomEnter: null, freeze: false,

  init() {

      if (on && !force) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
      if (on) return;

      if (req) { const p = req.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); }

  // ------------------------------------------------------------ resize (16:9 letterbox)

      }

    $("#btnJournal").onclick = () => { if (!UI.busy()) UI.journal(); };

  },

  // ------------------------------------------------------------ path-finding (BFS on tiles)
  blockedTile(x, y) {
    if (!isFloor(x, y) || dynSolid.has(idx(x, y))) return true;
    const px = x * T + 8, py = y * T + 10;
    for (const p of PROPS) if (p.solid && px >= p.x - 3 && px < p.x + p.pw + 3 && py >= p.y && py < p.y + p.ph + 5) return true;
    return false;
  },
  findPath(sx, sy, ex, ey) {
    const s = [Math.floor(sx / T), Math.floor(sy / T)];
    let e = [Math.floor(ex / T), Math.floor(ey / T)];
    if (this.blockedTile(...e)) { // nearest free tile to target
      let best = null, bd = 1e9;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { const x = e[0] + dx, y = e[1] + dy; if (!this.blockedTile(x, y)) { const d = dx * dx + dy * dy; if (d < bd) { bd = d; best = [x, y]; } } }
      if (!best) return null; e = best;
    }
    const prev = new Map(), q = [s], key = (x, y) => y * MW + x; prev.set(key(...s), null);
    while (q.length) {
      const [x, y] = q.shift();
      if (x === e[0] && y === e[1]) break;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = key(nx, ny); if (prev.has(k) || this.blockedTile(nx, ny)) continue; prev.set(k, key(x, y)); q.push([nx, ny]); }
    }
    if (!prev.has(key(...e))) return null;
    const path = []; let k = key(...e);
    while (k !== null) { path.unshift({ x: (k % MW) * T + 8, y: Math.floor(k / MW) * T + 11 }); k = prev.get(k); }
    path.shift();
    if (path.length) { path[path.length - 1] = { x: ex, y: ey }; if (!boxFree(ex, ey)) path[path.length - 1] = { x: e[0] * T + 8, y: e[1] * T + 11 }; }
    return path;
  },
  walkPlayerTo(x, y, then) { const p = this.findPath(this.player.x, this.player.y, x, y); if (!p) return; this.player.path = p; this.player.onArrive = then; },
  walkNpc(c, x, y, opt = {}) { return new Promise((res) => { const p = this.findPath(c.x, c.y, x, y); if (!p || !p.length) { if (!p) { c.x = x; c.y = y; } res(); return; } const sp0 = c.speed; if (opt.speed) c.speed = opt.speed; const fin = () => { c.speed = sp0; res(); }; c.path = p; c.onArrive = fin; setTimeout(() => { if (c.onArrive === fin) { c.path = null; c.onArrive = null; if (opt.snap) { c.x = x; c.y = y; } fin(); } }, opt.timeout || 6000); }); },
  runTo(c, tx, ty, dir) { return this.walkNpc(c, tx * T + 8, ty * T + 12, { speed: 96, timeout: 25000, snap: true }).then(() => { c.dir = dir; }); },
  place(c, tx, ty, dir = 0) { c.x = tx * T + 8; c.y = ty * T + 12; c.dir = dir; c.path = null; },

  // ------------------------------------------------------------ interactables
  buildFactInteractables() {
    for (const p of PROPS) {
      if (p.fact) this.addInteract({ id: "fact_" + p.id, x: p.x + p.pw / 2, y: p.y + p.ph + 8, label: "Inspect", name: p.label, fact: p.fact, use: () => UI.fact(p.fact), marker: () => !G.discovered.has(p.fact) ? "?" : null });
    }
    const mw = propById.mars_window; this.addInteract({ id: "mwin", x: mw.x + mw.pw / 2, y: mw.y + mw.ph + 8, r: 30, label: "Look", name: "Mars window", use: () => MarsWindow.open(), marker: () => G.flags && G.flags.window ? null : "?" });
    const pt = propById.photo_table; this.addInteract({ id: "photo", x: pt.x + pt.pw / 2, y: pt.y + pt.ph + 8, label: "Look", name: "Crew photo album", use: () => PhotoAlbum.open(), marker: () => G.flags && G.flags.photo ? null : "?" });
    const ht = propById.holo_table; this.addInteract({ id: "holo", x: ht.x + ht.pw / 2, y: ht.y + ht.ph + 8, label: "Explore", name: "Mars hologram", marker: () => Story.onHolo ? "!" : null, use: async () => { await MarsGlobe.open(); G.flags.holo = true; if (Story.onHolo) { const f = Story.onHolo; Story.onHolo = null; f(); } } });
    const hp = propById.hope; this.addInteract({ id: "hope", x: hp.x + 8, y: hp.y + hp.ph + 8, label: "Look", name: "Hope", use: () => Story.hope() });
  },
  addInteract(o) { o.r = o.r || 24; o.enabled = o.enabled || (() => true); this.interactables = this.interactables.filter((i) => i.id !== o.id); this.interactables.push(o); return o; },
  removeInteract(id) { this.interactables = this.interactables.filter((i) => i.id !== id); },
  nearestInteract() {
    const P = this.player; let best = null, bd = 1e9;
    for (const i of this.interactables) { if (!i.enabled()) continue; const raw = Math.hypot(i.x - P.x, i.y - P.y); const d = raw - (i.marker && i.marker() === "!" ? 40 : 0); if (raw < i.r && d < bd && roomVisible(i)) { bd = d; best = i; } }
    return best;
  },
  tryInteract() { if (this.mode !== "play" || this.freeze || UI.busy()) return; const it = this.nearestInteract(); if (it) this.useInteractable(it); },
  async useInteractable(it) {
    if (UI.busy() || this.freeze) return;
    const P = this.player; const dx = it.x - P.x, dy = (it.y - 10) - P.y;
    P.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0);
    if (it.npc) { const n = it.npc; const ddx = P.x - n.x, ddy = P.y - n.y; n.dir = Math.abs(ddx) > Math.abs(ddy) ? (ddx < 0 ? 2 : 3) : (ddy < 0 ? 1 : 0); }
    Sound.play("click");
    this.freeze = true; try { await it.use(); } finally { this.freeze = false; }
  },
  // wait until the player interacts with an NPC / thing
  waitTalk(id, npc, label = "Talk", extra = {}) {
    return new Promise((res) => {
      const c = npc;
      this.addInteract({ id, npc: c, get x() { return c.x; }, get y() { return c.y + 6; }, r: 26, label, name: c ? CONFIG.NAMES[c.id] : extra.name, marker: () => "!", use: async () => { this.removeInteract(id); res(); }, ...extra });
    });
  },
  waitRoom(room) { return new Promise((res) => { if (this.room === room) { res(); return; } this.onRoomEnter = (r) => { if (r === room) { this.onRoomEnter = null; res(); } }; }); },
  setTarget(t) { this.target = t; this.guidePath = null; this.guideT = 0; },

  // ------------------------------------------------------------ minimap (top-right) with route line
  drawMinimap(t) {
    const c = $("#minimap"); if (!c) return; const g = c.getContext("2d");
    const S = 3, ox = 0, oy = 0, P = this.player; // 80x40 tiles -> 240x120 (+12 for margin)
    g.clearRect(0, 0, c.width, c.height);
    const mx = (x) => ox + x / T * S, my = (y) => oy + 6 + y / T * S;
    // corridors
    g.fillStyle = this.room === "corridor" ? "#5a6390" : "#2c3250";
    for (const [x, y, w, h] of CORRIDORS) g.fillRect(x * S, 6 + y * S, w * S, h * S);

function miniPortrait(id, mood = "calm") { const c = mkCanvas(42, 42); const g = c.getContext("2d"); g.drawImage(moodPortrait(id, false, false, mood), 0, 0); drawEmote(g, mood, 0.1); c.style.background = shade(CHAR_SPECS[id].stripe, 0.4); c.style.borderRadius = ".3em"; return c; }
function mgSay(box, id, text) { box.innerHTML = ""; box.appendChild(miniPortrait(id, inferMood(id, text))); box.appendChild(el("span", "", fill(text))); box.animate([{ transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 250 }); }

const Minigames = {
  // ------------------------------------------------------------ flip cards
  flipCards() {
    return new Promise((resolve) => {
      let flipped = new Set();
      const html = `<h3>LAYLA'S GREENHOUSE</h3><h1>Tap a card to flip it!</h1><div class="flipgrid">${STORY.gardenCards.map((c, i) => `<div class="flip" data-i="${i}"><div class="in"><div class="f"><span>${c.i}</span>${c.q}</div><div class="b">${c.a}</div></div></div>`).join("")}</div><div class="src" style="margin-top:.6em">📚 ${UI.srcHtml(["veggie", "csaFarming", "redPlanet"]).replace('<div class="src">', "").replace("</div>", "")}</div>`;
      UI.card(html, [{ id: "ok", label: "Flip all cards first", cls: "go" }], {
        noKey: true, onMount: (c, done) => {
          const btn = c.querySelector(".btn"); btn.disabled = true;
          c.querySelectorAll(".flip").forEach((f) => f.onclick = () => { f.classList.toggle("on"); Sound.play("whoosh"); flipped.add(f.dataset.i); if (flipped.size >= STORY.gardenCards.length) { btn.disabled = false; btn.textContent = "Let's check the plants!"; } });
        },
      }).then(resolve);
    });
  },

  // ------------------------------------------------------------ garden check
  garden() {
    Sound.setMood("task");
    return new Promise((resolve) => {
      const TOOL = { water: "💧 Water", light: "💡 Light", heat: "🔥 Heat" };
      const ICON = { water: "💧", light: "💡", heat: "🌡️" };
      const SAY = { water: "The roots are drinking now. Water is precious here, so we reuse it again and again.", light: "Without light, the plant can't make its food.", heat: "The heater is working. Notice that all of this needs power." };
      let sel = 0;
      const html = `<div class="head"><div><h3>MINI-TASK</h3><h1>Garden Check</h1></div></div><p style="font-size:.85em">Look at the sign above each tray. Pick a tray, then the right tool.</p><div class="trays"></div><div class="tools">${Object.keys(TOOL).map((k) => `<button class="tool" data-k="${k}">${TOOL[k]}</button>`).join("")}</div><div class="say"></div>`;
      UI.card(html, [], {
        cls: "mg", onMount: (c, done) => {
          const tr = c.querySelector(".trays"), say = c.querySelector(".say");
          const draw = () => {
            tr.innerHTML = "";
            [0, 1, 2].forEach((i) => {
              const t = G.trays[i];
              const d = el("div", "trayc" + (i === sel ? " sel" : "") + (t.fixed ? " ok" : ""), `<div class="pi">${t.fixed ? "✅" : ICON[t.problem]}</div><div class="pl">${t.fixed ? "🌿🌿🌿" : "🥀🌿🥀"}</div><div style="font-size:.7em">Tray ${i + 1}</div>`);
              d.onclick = () => { if (!t.fixed) { sel = i; Sound.play("click"); draw(); } };
              tr.appendChild(d);
            });
          };
          mgSay(say, "layla", "Which tray first? Look at the little signs!");
          draw();
          c.querySelectorAll(".tool").forEach((b) => b.onclick = () => {
            const t = G.trays[sel]; if (t.fixed) return;
            if (b.dataset.k === t.problem) {
              t.fixed = true; t.lightOff = false; Sound.play("good"); Particles.sparkle(propById["tray" + (sel + 1)].x + 24, propById["tray" + (sel + 1)].y - 8);
              mgSay(say, "layla", SAY[t.problem]);
              const next = [0, 1, 2].find((i) => !G.trays[i].fixed);
              if (next === undefined) { draw(); Sound.play("success"); setTimeout(() => { done("ok"); Sound.setMood("calm"); resolve(); }, 2600); return; }
              sel = next; draw();
            } else { Sound.play("error"); mgSay(say, "layla", "Not that one. Look at the sign above the tray."); c.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 200 }); }
          });
        },
      });
    });
  },

  // ------------------------------------------------------------ clean the panels (in the world)
  panels() {
    const B = BALANCE.panels;
    return new Promise((resolve) => {
      let time = B.time, cleaned = 0, tripped = false;
      G.panels = [0.9, 0.9, 0.9, 0.9, 0.9, 0.9];
      UI.objective(`Clean the solar panels! Walk to a panel and press ${document.body.classList.contains("touch") ? "A" : "Space"}`);
      UI.toast(`☀️ Clean as many panels as you can — <b>${B.time - B.tripAt} seconds!</b> Panels are joined in pairs — one job cleans two!`, 3500);
      const ids = [];
      for (let k = 0; k < 3; k++) {
        const a = propById["panel" + k * 2], b = propById["panel" + (k * 2 + 1)]; const id = "scrub" + k; ids.push(id);
        const job = PANEL_JOBS[k];
        Game.addInteract({ id, x: (a.x + b.x + b.pw) / 2, y: a.y + a.ph + 8, r: 34, label: job === "brush" ? "Brush" : job === "pebbles" ? "Clear rocks" : "Tilt", name: `Panels ${k * 2 + 1} + ${k * 2 + 2}`, marker: () => "!", use: async () => {

          const res = await Minigames.panelJob(k, () => Math.max(0, time - B.tripAt));
          if (res && res.ok && !tripped) {
            G.panels[k * 2] = 0; G.panels[k * 2 + 1] = 0; cleaned += 2; Sound.play("good"); Particles.sparkle(a.x + 24, a.y + 8); Particles.sparkle(b.x + 24, b.y + 8); Game.removeInteract(id);
            UI.toast(`✨ Panels ${k * 2 + 1} + ${k * 2 + 2} clean! ${cleaned}/6`);
            if (cleaned === 6) time = Math.min(time, B.tripAt + 0.01);
          }
        } });
      }
      Game.setTarget(null);
      const N = Game.npc;
      Story.panelsMission = (dt) => {

const MarsTex = {
  levels: {}, // level -> {w,h,data:Uint8ClampedArray, real:bool}
  loading: {},
  fallback: null,
  get(level) { return this.levels[level] || this.levels[0] || this.fallbackTex(); },
  isReal() { return !!(this.levels[1] || this.levels[0]); },
  load(level) {
    if (this.levels[level] || this.loading[level]) return this.loading[level];
    const rows = 1 << level, cols = rows * 2, S = 256;
    const cv = mkCanvas(cols * S, rows * S), g = cv.getContext("2d");

      const im = new Image(); im.crossOrigin = "anonymous";

      im.src = `${TREK_TILES}${level}/${r}/${c}.jpg`;

  fallbackTex() {

// precomputed sphere tables per (size, tilt)
const _sphereCache = {};
function sphereTable(S, tilt) {

}

function drawHoloMars(g, p, t) {

function textW(str, sc = 1) { return str.length * 6 * sc - sc; }

// typewriter: shows the first n characters; plays a blip for each new letter
const _typed = {};
function typeText(g, id, str, x, y, t, t0, cps, sc, color, shadow, cursor = true) {
  if (t < t0) return 0;
  const n = Math.min(str.length, Math.floor((t - t0) * cps));
  if (_typed[id] === undefined || n < _typed[id]) _typed[id] = 0;
  if (n > _typed[id]) { if (str[n - 1] !== " ") Sound.play("type"); _typed[id] = n; }

// ---------------------------------------------------------------- easing / helpers
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = (k) => 1 - Math.pow(1 - clamp01(k), 3);
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const between = (t, a, b) => t >= a && t < b;
function rnd(i, j = 0) { return hash(i * 13 + 7, j * 29 + 3); }
// thick pixel line (limb) stamped with squares — keeps edges crisp
function limb(g, x0, y0, x1, y1, w, color) {
  g.fillStyle = color;
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  for (let i = 0; i <= n; i++) { const k = i / n; g.fillRect(Math.round(x0 + (x1 - x0) * k - w / 2), Math.round(y0 + (y1 - y0) * k - w / 2), w, w); }
}
function pxCircle(g, cx, cy, r, color) { g.fillStyle = color; for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const _ditherMasks = [];
function ditherMask(level) { // level 0..16
  level = Math.max(0, Math.min(16, Math.round(level)));

// ---------------------------------------------------------------- particle pools (no per-frame allocation)
class Pool {
  constructor(n) { this.p = Array.from({ length: n }, () => ({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, s: 1, ds: 0, c: "#fff", g: 0, kind: 0, ph: 0, drag: 0 })); this.i = 0; }

  update(dt) { for (const p of this.p) { if (!p.on) continue; p.life -= dt; if (p.life <= 0) { p.on = false; continue; } p.vy += p.g * dt; if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; } p.x += p.vx * dt; p.y += p.vy * dt; p.s += p.ds * dt; } }

    }

// =====================================================================

// =====================================================================
const Intro = {

  running: false, s: 0, last: 0, cues: [], narr: {}, shot: null, debug: false, dissolve: 0,
  pools: null,

  init() {

    this.tmp = mkCanvas(IW, IH);

  // ------------------------------------------------------------ clock
  // Master clock = Web Audio time. Script time s = real seconds / PACE.
  now() { const c = Sound.ctx; return c && c.state === "running" ? c.currentTime : performance.now() / 1000; },
  get pace() { return INTRO_TIMING.PACE || 1; },

  // Narration plan in REAL seconds from the intro start. n1..n4a at their anchors (x PACE);

    const plan = {};

  // ------------------------------------------------------------ click-to-start
  showStart() {

      <div class="gtitle">${CONFIG.GAME_TITLE}</div>
      <div class="gsub">${CONFIG.SUBTITLE.toUpperCase()}</div>
      <p class="solnote"><b>What is a sol?</b> A day on Mars is called a <b>sol</b>. Mars spins a little slower than Earth, so one sol is about <b>24 hours and 40 minutes</b> — about 40 minutes longer than a day on Earth. Astronauts say “sol” so they never mix up Mars days and Earth days. Our story starts on the crew’s <b>200th sol</b> on Mars!</p>
      <button class="btn go" id="tStart">▶ Start</button>
      <p class="cs-hint">🎧 Best with sound on</p>
      <div><button class="btn alt" id="tFull">⛶ Full screen</button><button class="btn alt" id="tSet">⚙️ Settings</button><button class="btn alt" id="tSrc">🛰️ NASA Data</button></div></div>

  },

  async loadAudio() {
    const files = CONFIG.NARRATION_FILES || {}, ctx = Sound.ctx;
    const narr = Promise.all(["N1", "N2", "N3", "N4A", "N4B", "N4C"].map(async (k) => {
      this.narr[k] = {};

  async start(fromShot) {

    this.subEl = sub;
    const sk = el("button", "", "Skip ⏭"); sk.id = "iskip"; sk.onclick = (e) => { e.stopPropagation(); this.skip(); }; UI.root.appendChild(sk); this.skipEl = sk;
    if (this.debug) { const d = el("div"); d.id = "idebug"; UI.root.appendChild(d); this.dbgEl = d; }

  // ------------------------------------------------------------ cues (sound + music); narration runs on real time
  buildCues(s0) {

  playMusic(k) {

  runCues() {

  // blit a region of the world buffer B with a camera (sub-pixel position, zoom)
  cam(g, cx, cy, zoom, shake = 0) {

    b.fillStyle = "#0e2a24"; b.fillRect(152, 112, 176, 20); pxText(b, "SOLAR ACTIVITY TODAY:", 156, 114, 1, "#ffd34a"); pxText(b, lvl, 156, 123, 1, "#ffffff");
    b.save(); b.globalCompositeOperation = "lighter"; const wg = b.createRadialGradient(240, 60, 10, 240, 120, 260); wg.addColorStop(0, "rgba(255,226,180,0.2)"); wg.addColorStop(1, "rgba(0,0,0,0)"); b.fillStyle = wg; b.fillRect(0, 0, IW, IH); b.restore();
    bustBack(b, "marcus", 338, 198, { breathe: this.breathe(q, 0.6) });
    // Damon: three-quarter view, hands on the console edge
    let turn = 0.25, gx = 0.6, gy = 0, brow = "neutral", arm = "console", armK = 1, breathe = this.breathe(q), mouth = "closed";
    if (s >= Bt.damonLook && s < Bt.damonLook + 1.2) { turn = 0.6; gx = 1; brow = "worry"; }
    if (s >= Bt.starTouch) { arm = "star"; armK = ease(seg(s, Bt.starTouch, Bt.starTouch + 0.8)); gx = 0.2; }
    if (s >= Bt.breath) { const k = seg(s, Bt.breath, Bt.breath + 0.8) - seg(s, Bt.breath + 1.4, Bt.breath + 2.2); breathe = Math.round(k * 2); if (between(s, Bt.breath + 0.1, Bt.breath + 0.8)) gy = 1; if (s >= Bt.breath + 0.8) { brow = "firm"; gy = 0; gx = 0; } }
    const bodyTurn = s >= Bt.damonLook + 2 / 12 && s < Bt.damonLook + 1.2 + 2 / 12 ? 0.6 : 0.25; // body follows the head 2 frames later
    bust(b, "lead", 160, 240, { f: 1, turn, bodyTurn, gx, gy, brow, mouth, arm, armK, star: true, glint: s >= Bt.starTouch + 0.8 && s < Bt.starTouch + 1.05 ? 1 : 0, breathe, blink: s < Bt.damonLook ? this.blink(q, 0.3, 3.6) : s > Bt.breath + 1 ? this.blink(q, 0.9, 4) : 0 });
    // console rail in front
    b.fillStyle = "#3c4258"; b.fillRect(0, 252, IW, 18); b.fillStyle = "#5a6280"; b.fillRect(0, 252, IW, 2);
    for (let x = 20; x < IW; x += 14) { b.fillStyle = rnd(x, (s * 2) | 0) > 0.5 ? "#5dff8a" : "#1a1d2a"; b.fillRect(x, 260, 3, 2); }
    const z = lerp(1, 1.08, ease(seg(s, Bt.insideCut, 63.5)));
    this.cam(g, 236, 146, z);
    // final line
    if (s >= Bt.finalText[0]) { g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(0, 20, IW, 30); typeText(g, "final", INTRO_TIMING.texts.final, Math.round((IW - textW(INTRO_TIMING.texts.final, 2)) / 2), 28, s, Bt.finalText[0], INTRO_TIMING.texts.final.length / (Bt.finalText[1] - Bt.finalText[0]), 2, "#e0a96d", "#000"); }
    // pixel dither dissolve into the top-down game room
    if (s >= Bt.dissolve) {
      const k = seg(s, Bt.dissolve, this.endT);
      renderWorld(Game.lg, t, dt);
      const tg = this.tmp.getContext("2d"); tg.imageSmoothingEnabled = false; tg.globalCompositeOperation = "source-over"; tg.clearRect(0, 0, IW, IH);
      tg.drawImage(Game.low, 0, 0, IW, IH);
      tg.globalCompositeOperation = "destination-in"; tg.drawImage(ditherMask(k * 16), 0, 0);
      g.drawImage(this.tmp, 0, 0);
    }
  },
};

// smooth value noise used by the planets
const _ng = Array.from({ length: 64 * 32 }, (_, i) => hash(i % 64, (i / 64) | 0));
function noise2(x, y) {
  let tot = 0, amp = 1, norm = 0;
  for (let o = 0; o < 3; o++) {
    const fx = (x * 64) / (Math.PI * 2) * (1 << o), fy = ((y + Math.PI / 2) / Math.PI) * 32 * (1 << o);
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
    const v = (a, b) => _ng[((((b % 32) + 32) % 32) * 64) + (((a % 64) + 64) % 64)];
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const n = lerp(lerp(v(x0, y0), v(x0 + 1, y0), sx), lerp(v(x0, y0 + 1), v(x0 + 1, y0 + 1), sx), sy);
    tot += n * amp; norm += amp; amp *= 0.5;
  }
  return tot / norm;
}
