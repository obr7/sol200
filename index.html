// Live DONKI fetch (NASA Open APIs). Falls back to ARCHIVED data.
// ---------------------------------------------------------------------
const SpaceWeather = {
  status: "idle", // idle | loading | live | archived
  flares: [],
  strongest: null,
  fetchedAt: null,
  async load() {
    if (this.status === "loading" || this.status === "live") return;
    this.status = "loading";
    const end = new Date();
    const start = new Date(end.getTime() - 30 * 86400000);
    const f = (d) => d.toISOString().slice(0, 10);
    const url = `https://api.nasa.gov/DONKI/FLR?startDate=${f(start)}&endDate=${f(end)}&api_key=${CONFIG.NASA_API_KEY}`;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error("bad data");
      this.flares = data
        .filter((x) => x && x.classType)
        .map((x) => ({ classType: x.classType, peakTime: x.peakTime || x.beginTime, link: x.link }))
        .sort((a, b) => (a.peakTime < b.peakTime ? 1 : -1));
      this.status = "live";
      this.fetchedAt = new Date();
    } catch (e) {
      this.flares = ARCHIVED_SPACE_WEATHER.flares.slice();
      this.status = "archived";
    }
    this.strongest = this.flares.reduce((best, x) => (!best || flareValue(x.classType) > flareValue(best.classType) ? x : best), null);
  },
  // risk level from the last 7 days (live) or the archived record
  risk() {
    let list = this.flares;
    if (this.status === "live") {
      const cut = Date.now() - 7 * 86400000;
      list = list.filter((x) => new Date(x.peakTime).getTime() >= cut);
    }
    const s = list.reduce((b, x) => Math.max(b, flareValue(x.classType)), 0);
    if (s >= 1e-4) return "X";
    if (s >= 1e-5) return "M";
    return "quiet";
  },
};
function flareValue(c) {
  if (!c) return 0;
  const m = { A: 1e-8, B: 1e-7, C: 1e-6, M: 1e-5, X: 1e-4 }[c[0]] || 0;
  return m * (parseFloat(c.slice(1)) || 1);
}

    const m = name.match(/^([A-G])(#|b)?(-?\d)$/);

  // ------------------------------------------------------------ narrator voice (browser TTS fallback)
  function speak(text, onend) {
    if (!S.voice || S.muted || !("speechSynthesis" in window)) { onend && onend(false); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ","));
      const vs = speechSynthesis.getVoices();
      const pick = vs.find((v) => /en-GB/.test(v.lang) && /Male|Daniel|George|Arthur/i.test(v.name)) || vs.find((v) => /Google UK English Male/.test(v.name)) || vs.find((v) => /^en/.test(v.lang));
      if (pick) u.voice = pick;
      u.rate = 0.9; u.pitch = 0.85; u.volume = 1;
      u.onend = () => onend && onend(true); u.onerror = () => onend && onend(false);
      speechSynthesis.speak(u);
    } catch (e) { onend && onend(false); }
  }

function drawCharacter(g, c, t) {
  const set = CharSprites[c.sprite + (c.helmet ? "_h" : "")];
  if (!set) return;
  const frame = c.moving ? (Math.floor(c.walkT * 8) % 4) : 0;
  const blink = (t + c.blinkOff) % 4 < 0.12;
  const img = set.dirs[c.dir][frame][blink ? 1 : 0];

  g.drawImage(img, Math.round(c.x - 9), Math.round(c.y - 26 + breathe));

// ---------------------------------------------------------------- frame
let darkCv, darkG;
function renderWorld(g, t, dt) {
  const P = Game.player;
  // camera
  const tx = P.x - VW / 2, ty = P.y - 12 - VH / 2;
  Cam.x += (tx - Cam.x) * Math.min(1, dt * 8); Cam.y += (ty - Cam.y) * Math.min(1, dt * 8);
  Cam.x = Math.max(-8, Math.min(MW * T - VW + 8, Cam.x)); Cam.y = Math.max(-44, Math.min(MH * T - VH + 8, Cam.y));
  let sx = 0, sy = 0; if (Cam.shake > 0) { Cam.shake -= dt; sx = (Math.random() - 0.5) * 4; sy = (Math.random() - 0.5) * 4; }
  const cx = Math.round(Cam.x + sx), cy = Math.round(Cam.y + sy);
  g.fillStyle = "#05060c"; g.fillRect(0, 0, VW, VH);
  g.save(); g.translate(-cx, -cy);
  g.drawImage(MapCanvas, cx, cy, VW, VH, cx, cy, VW, VH);
  glows = [];
  const curRoom = roomAt(P.x, P.y - 4);
  const visR = curRoom === "outside" ? 150 - (G.storm || 0) * 85 : 78;
  const visible = (x, y) => { const r = roomAt(x, y); if (r && r === curRoom && !(r === "outside" && (G.storm || 0) > 0.2)) return true; return curRoom === "outside" && r === "outside" && Math.hypot(x - P.x, y - P.y) < visR; };
  // drawables
  const list = [];
  for (const p of PROPS) {
    if (p.x + p.pw < cx - 20 || p.x > cx + VW + 20 || p.y + p.ph < cy - 40 || p.y > cy + VH + 20) continue;
    list.push({ y: p.y + p.ph, d: () => drawProp(g, p, t) });
  }
  for (const c of Game.chars) { if (!c.visible) continue; if (c !== P && !visible(c.x, c.y - 4)) continue; list.push({ y: c.y, d: () => drawCharacter(g, c, t) }); }
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.d();
  Particles.draw(g);
  // ambient motes in current room
  g.fillStyle = curRoom === "outside" ? "rgba(255,180,120,0.5)" : "rgba(255,255,255,0.35)";
  for (const m of Motes) { const x = m.x + Math.sin(t * m.s + m.ph) * 6, y = (m.y - t * 4 * m.s) % (MH * T); const yy = y < 0 ? y + MH * T : y; if (x > cx && x < cx + VW && yy > cy && yy < cy + VH) g.fillRect(x | 0, yy | 0, 1, 1); }

  g.globalCompositeOperation = "lighter";
  for (const L of glows) { const gr = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r); gr.addColorStop(0, hexA(L.color, L.a)); gr.addColorStop(1, hexA(L.color, 0)); g.fillStyle = gr; g.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2); }
  g.globalCompositeOperation = "source-over";

  Game.drawWorldMarkers(g, t, visible);
  g.restore();

  // darkness (Among-Us style)
  if (!darkCv) { darkCv = mkCanvas(VW, VH); darkG = darkCv.getContext("2d"); }
  darkG.globalCompositeOperation = "source-over"; darkG.clearRect(0, 0, VW, VH);
  darkG.fillStyle = curRoom === "outside" ? "rgba(20,8,4,0.86)" : "rgba(3,4,12,0.9)"; darkG.fillRect(0, 0, VW, VH);
  darkG.globalCompositeOperation = "destination-out";
  darkG.fillStyle = "#000";
  const stormOut = curRoom === "outside" && (G.storm || 0) > 0.2;
  if (curRoom && ROOMS[curRoom] && !stormOut) {
    const r = ROOMS[curRoom];
    darkG.fillRect(r.x * T - cx - 16, (r.y - 2) * T - cy, (r.w + 2) * T, (r.h + 3) * T);
  } else if (curRoom === "corridor") {
    // the whole corridor network lights up
    darkG.drawImage(corridorMask(), cx, cy, VW, VH, 0, 0, VW, VH);
  }
  if (curRoom === "outside" || !curRoom) {
    const px = P.x - cx, py = P.y - 10 - cy;
    const gr = darkG.createRadialGradient(px, py, visR * 0.45, px, py, visR);
    gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    darkG.fillStyle = gr; darkG.fillRect(px - visR, py - visR, visR * 2, visR * 2);

    g.fillStyle = `rgba(150,75,35,${storm * (outside ? 0.45 : 0.12)})`; g.fillRect(0, 0, VW, VH);
    if (outside) { g.fillStyle = `rgba(230,150,90,${0.5 * storm})`; for (const d of StormDust) { d.x += d.v * dt * storm; d.y += d.v * 0.2 * dt; if (d.x > VW) { d.x = -10; d.y = Math.random() * VH; } if (d.y > VH) d.y = 0; g.fillRect(d.x | 0, d.y | 0, d.l, 1); } }
  }

}
let _cMask = null;
function corridorMask() {
  if (_cMask) return _cMask;
  _cMask = mkCanvas(MW * T, MH * T); const g = _cMask.getContext("2d"); g.fillStyle = "#000";
  const isCor = (x, y) => isFloor(x, y) && !roomMap[idx(x, y)] && x < 54;

function drawPropV2(g, p, t) {

// =====================================================================

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const fill = (s) => s.replace(/\{lead\}/g, CONFIG.NAMES.lead).replace(/\{marcus\}/g, CONFIG.NAMES.marcus).replace(/\{diego\}/g, CONFIG.NAMES.diego).replace(/\{layla\}/g, CONFIG.NAMES.layla);
const SPEAKER_COLOR = { lead: "#e04848", marcus: "#3b7dd8", diego: "#f08a2a", layla: "#4fb35e" };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const UI = {
  root: null, active: null, // active = {type, onAction, onKey}
  init() { this.root = $("#ui"); },
  clear() { this.root.innerHTML = ""; this.active = null; },
  busy() { return !!this.active; },
  action() { if (this.active && this.active.onAction) { this.active.onAction(); return true; } return !!this.active; },
  key(k) { if (this.active && this.active.onKey) return this.active.onKey(k); return false; },

  // ------------------------------------------------------------ dialogue
  say(who, text, opts = {}) {
    return new Promise((resolve) => {
      text = fill(text);
      const name = who === "narrator" ? "Narrator" : who === "earth" ? "Mission Control" : who === "sys" ? "" : CONFIG.NAMES[who];
      const wrap = el("div"); wrap.id = "dialog";
      const box = el("div"); box.id = "dlgBox"; if (opts.think) box.classList.add("think"); if (opts.radio) box.classList.add("radio");
      const tag = opts.think ? "💭 THINKING" : opts.radio ? "📻 RADIO" : "";
      box.innerHTML = (tag ? `<div id="dlgTag">${tag}</div>` : "") + `<div id="dlgText"></div><div id="dlgNext" class="hidden">▼</div>`;
      wrap.appendChild(box);
      let port = null;
      if (CHAR_SPECS[who]) {
        const side = el("div"); side.id = "dlgSide";
        port = el("canvas"); port.id = "dlgPort"; port.width = 42; port.height = 42;
        port.style.background = `radial-gradient(circle at 50% 40%, ${shade(CHAR_SPECS[who].stripe, 0.55)}, ${shade(CHAR_SPECS[who].stripe, 0.15)})`;
        const nm = el("div", "", name); nm.id = "dlgName"; nm.style.borderColor = SPEAKER_COLOR[who];
        side.appendChild(port); side.appendChild(nm); wrap.appendChild(side);
      } else if (name) { box.insertAdjacentHTML("afterbegin", `<div id="dlgTag">${name.toUpperCase()}</div>`); }
      this.root.appendChild(wrap);
      const tEl = box.querySelector("#dlgText"), nEl = box.querySelector("#dlgNext");
      let i = 0, done = false, last = 0;
      const plain = text;
      const finish = () => { done = true; tEl.innerHTML = plain; nEl.classList.remove("hidden"); };
      const step = () => {
        if (done) return;
        i += 1;
        tEl.textContent = plain.slice(0, i);
        if (i % 2 === 0 && /\w/.test(plain[i] || "")) Sound.play("blip", opts.think ? "sys" : who);
        if (i >= plain.length) finish(); else setTimeout(step, /[.,!?]/.test(plain[i - 1]) ? 90 : 24);
      };
      step();
      const anim = () => { if (!wrap.isConnected) return; if (port) { const g = port.getContext("2d"); g.clearRect(0, 0, 42, 42); const tt = performance.now() / 1000; g.drawImage(getPortrait(who, tt % 3.5 < 0.13, !done && (tt * 8 | 0) % 2 === 0, opts.mood || (opts.think ? 1 : 0)), 0, 0); } requestAnimationFrame(anim); };
      anim();
      const advance = () => { if (!done) { finish(); return; } Sound.play("click"); wrap.remove(); this.active = null; resolve(); };
      wrap.onclick = (e) => { e.stopPropagation(); advance(); };
      this.active = { type: "say", onAction: advance };
    });
  },
  async talk(lines) { for (const l of lines) { if (typeof l === "function") { await l(); continue; } await this.say(l[0], l[1], l[2] || {}); } },

  // ------------------------------------------------------------ choice
  choose(prompt, options) {
    return new Promise((resolve) => {
      Sound.play("open");
      const c = el("div"); c.id = "choice";
      c.appendChild(el("h2", "", fill(prompt)));

const G = {

function makeChar(id, sprite, tx, ty) { return { id, sprite, x: tx * T + 8, y: ty * T + 12, dir: 0, moving: false, walkT: 0, blinkOff: Math.random() * 4, visible: true, path: null, speed: 52, follow: null, helmet: false, hurt: false }; }

const Game = {
  chars: [], player: null, npc: {}, interactables: [], mode: "boot", room: null, target: null, guidePath: null, guideT: 0,
  keys: {}, joy: { x: 0, y: 0 }, trail: [], lastStepSound: 0, onRoomEnter: null, freeze: false,

  init() {

    UI.init(); UI.buildMeters(); this.updateJournal();

  saveProgress() { try { localStorage.setItem("sol200_progress", JSON.stringify({ discovered: [...G.discovered], introSeen: this.introSeen })); } catch (e) {} },
  updateJournal() { $("#jcount").textContent = G.discovered.size; },

  // ------------------------------------------------------------ resize (16:9 letterbox)
  resize() {
    const W = window.innerWidth, H = window.innerHeight;
    let w = W, h = W * 9 / 16; if (h > H) { h = H; w = H * 16 / 9; }
    const st = $("#stage"); st.style.width = w + "px"; st.style.height = h + "px"; st.style.fontSize = Math.max(9, w / 56) + "px";
    const c = $("#screen"), dpr = Math.min(2, window.devicePixelRatio || 1);

  // ------------------------------------------------------------ input
  setupInput() {
    window.addEventListener("keydown", (e) => {
      Sound.init();
      if (e.target && e.target.tagName === "INPUT") return;

        UI.key(k.length === 1 ? k.toLowerCase() : k); if (k.startsWith("Arrow") || k === " ") e.preventDefault(); return;
      }

      if (this.debugKeys && k === "F2") Story.debugSkip && Story.debugSkip();
    });
    window.addEventListener("keyup", (e) => { this.keys[keyOf(e).toLowerCase()] = false; });
    window.addEventListener("blur", () => { this.keys = {}; });
    const cv = $("#stage");
    cv.addEventListener("pointerdown", (e) => {
      Sound.init();

      const r = $("#screen").getBoundingClientRect();
      const wx = (e.clientX - r.left) / r.width * VW + Cam.x, wy = (e.clientY - r.top) / r.height * VH + Cam.y;
      // clicked an interactable?
      const it = this.interactables.filter((i) => i.enabled()).find((i) => Math.hypot(i.x - wx, i.y - 8 - wy) < 18 && roomVisible(i));
      if (it) { this.walkPlayerTo(it.x, it.y + 4, () => this.useInteractable(it)); return; }

    });

    const stick = $("#stick"), knob = $("#knob"); let sid = null, sc = null;
    stick.addEventListener("pointerdown", (e) => { Sound.init(); sid = e.pointerId; const r = stick.getBoundingClientRect(); sc = { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 }; stick.setPointerCapture(sid); move(e); });
    const move = (e) => { if (e.pointerId !== sid) return; let dx = e.clientX - sc.x, dy = e.clientY - sc.y; const d = Math.hypot(dx, dy), m = sc.r * 0.8; if (d > m) { dx *= m / d; dy *= m / d; } knob.style.transform = `translate(${dx}px,${dy}px)`; this.joy = { x: dx / m, y: dy / m }; };
    stick.addEventListener("pointermove", move);

    stick.addEventListener("pointerup", end); stick.addEventListener("pointercancel", end);
    $("#abtn").addEventListener("pointerdown", (e) => { e.preventDefault(); Sound.init(); if (UI.busy()) UI.action(); else this.tryInteract(); });
    $("#btnMap").onclick = () => { if (!UI.busy()) UI.map(); };
    $("#minimapWrap").onclick = () => { if (!UI.busy() && this.mode === "play") UI.map(); };
    $("#btnJournal").onclick = () => { if (!UI.busy()) UI.journal(); };
    $("#btnSettings").onclick = () => { if (!UI.busy()) UI.settings(); };
  },

  // ------------------------------------------------------------ path-finding (BFS on tiles)
  blockedTile(x, y) {
    if (!isFloor(x, y) || dynSolid.has(idx(x, y))) return true;
    const px = x * T + 8, py = y * T + 10;
    for (const p of PROPS) if (p.solid && px >= p.x - 3 && px < p.x + p.pw + 3 && py >= p.y && py < p.y + p.ph + 5) return true;
    return false;
  },
  findPath(sx, sy, ex, ey) {
    const s = [Math.floor(sx / T), Math.floor(sy / T)];
    let e = [Math.floor(ex / T), Math.floor(ey / T)];
    if (this.blockedTile(...e)) { // nearest free tile to target
      let best = null, bd = 1e9;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { const x = e[0] + dx, y = e[1] + dy; if (!this.blockedTile(x, y)) { const d = dx * dx + dy * dy; if (d < bd) { bd = d; best = [x, y]; } } }
      if (!best) return null; e = best;
    }
    const prev = new Map(), q = [s], key = (x, y) => y * MW + x; prev.set(key(...s), null);
    while (q.length) {
      const [x, y] = q.shift();
      if (x === e[0] && y === e[1]) break;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = key(nx, ny); if (prev.has(k) || this.blockedTile(nx, ny)) continue; prev.set(k, key(x, y)); q.push([nx, ny]); }
    }
    if (!prev.has(key(...e))) return null;
    const path = []; let k = key(...e);
    while (k !== null) { path.unshift({ x: (k % MW) * T + 8, y: Math.floor(k / MW) * T + 11 }); k = prev.get(k); }
    path.shift();
    if (path.length) { path[path.length - 1] = { x: ex, y: ey }; if (!boxFree(ex, ey)) path[path.length - 1] = { x: e[0] * T + 8, y: e[1] * T + 11 }; }
    return path;
  },
  walkPlayerTo(x, y, then) { const p = this.findPath(this.player.x, this.player.y, x, y); if (!p) return; this.player.path = p; this.player.onArrive = then; },
  walkNpc(c, x, y) { return new Promise((res) => { const p = this.findPath(c.x, c.y, x, y); if (!p || !p.length) { if (!p) { c.x = x; c.y = y; } res(); return; } c.path = p; c.onArrive = res; setTimeout(() => { if (c.onArrive === res) { c.path = null; c.onArrive = null; res(); } }, 6000); }); },
  place(c, tx, ty, dir = 0) { c.x = tx * T + 8; c.y = ty * T + 12; c.dir = dir; c.path = null; },

  // ------------------------------------------------------------ interactables
  buildFactInteractables() {
    for (const p of PROPS) {
      if (p.fact) this.addInteract({ id: "fact_" + p.id, x: p.x + p.pw / 2, y: p.y + p.ph + 8, label: "Inspect", name: p.label, fact: p.fact, use: () => UI.fact(p.fact), marker: () => !G.discovered.has(p.fact) ? "?" : null });
    }
    const pt = propById.photo_table; this.addInteract({ id: "photo", x: pt.x + pt.pw / 2, y: pt.y + pt.ph + 8, label: "Look", name: "Crew photo", use: () => Story.photo(), marker: () => G.flags && G.flags.photo ? null : "?" });
    const ht = propById.holo_table; this.addInteract({ id: "holo", x: ht.x + ht.pw / 2, y: ht.y + ht.ph + 8, label: "Use", name: "Base map", use: () => UI.map() });
    const hp = propById.hope; this.addInteract({ id: "hope", x: hp.x + 8, y: hp.y + hp.ph + 8, label: "Look", name: "Hope", use: () => Story.hope() });
  },
  addInteract(o) { o.r = o.r || 24; o.enabled = o.enabled || (() => true); this.interactables = this.interactables.filter((i) => i.id !== o.id); this.interactables.push(o); return o; },
  removeInteract(id) { this.interactables = this.interactables.filter((i) => i.id !== id); },
  nearestInteract() {
    const P = this.player; let best = null, bd = 1e9;
    for (const i of this.interactables) { if (!i.enabled()) continue; const raw = Math.hypot(i.x - P.x, i.y - P.y); const d = raw - (i.marker && i.marker() === "!" ? 40 : 0); if (raw < i.r && d < bd && roomVisible(i)) { bd = d; best = i; } }
    return best;
  },
  tryInteract() { if (this.mode !== "play" || this.freeze || UI.busy()) return; const it = this.nearestInteract(); if (it) this.useInteractable(it); },
  async useInteractable(it) {
    if (UI.busy() || this.freeze) return;
    const P = this.player; const dx = it.x - P.x, dy = (it.y - 10) - P.y;
    P.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0);
    if (it.npc) { const n = it.npc; const ddx = P.x - n.x, ddy = P.y - n.y; n.dir = Math.abs(ddx) > Math.abs(ddy) ? (ddx < 0 ? 2 : 3) : (ddy < 0 ? 1 : 0); }
    Sound.play("click");
    this.freeze = true; try { await it.use(); } finally { this.freeze = false; }
  },
  // wait until the player interacts with an NPC / thing
  waitTalk(id, npc, label = "Talk", extra = {}) {
    return new Promise((res) => {
      const c = npc;
      this.addInteract({ id, npc: c, get x() { return c.x; }, get y() { return c.y + 6; }, r: 26, label, name: c ? CONFIG.NAMES[c.id] : extra.name, marker: () => "!", use: async () => { this.removeInteract(id); res(); }, ...extra });
    });
  },
  waitRoom(room) { return new Promise((res) => { if (this.room === room) { res(); return; } this.onRoomEnter = (r) => { if (r === room) { this.onRoomEnter = null; res(); } }; }); },
  setTarget(t) { this.target = t; this.guidePath = null; this.guideT = 0; },

  // ------------------------------------------------------------ minimap (top-right) with route line
  drawMinimap(t) {
    const c = $("#minimap"); if (!c) return; const g = c.getContext("2d");
    const S = 3, ox = 0, oy = 0, P = this.player; // 80x40 tiles -> 240x120 (+12 for margin)
    g.clearRect(0, 0, c.width, c.height);
    const mx = (x) => ox + x / T * S, my = (y) => oy + 6 + y / T * S;
    // corridors
    g.fillStyle = this.room === "corridor" ? "#5a6390" : "#2c3250";
    for (const [x, y, w, h] of CORRIDORS) g.fillRect(x * S, 6 + y * S, w * S, h * S);
    // rooms
    for (const [id, r] of Object.entries(ROOMS)) {
      const here = this.room === id, isTarget = this.target && roomAt(this.target.x, this.target.y) === id;
      g.fillStyle = id === "outside" ? (here ? "#b5602f" : "#5a2c16") : here ? shade(r.wall, 0.35) : shade(r.wall, -0.45);
      g.fillRect(r.x * S, 6 + r.y * S, r.w * S, r.h * S);
      g.strokeStyle = isTarget ? `rgba(255,211,74,${0.6 + Math.sin(t * 6) * 0.4})` : here ? "#ffffff" : "rgba(255,255,255,0.15)";
      g.lineWidth = isTarget || here ? 2 : 1; g.strokeRect(r.x * S + 0.5, 6 + r.y * S + 0.5, r.w * S - 1, r.h * S - 1);

  // ------------------------------------------------------------ share the power
  power() {
    Sound.setMood("task");
    const B = BALANCE.power;
    const DEV = [
      { k: "oxygen", n: "Oxygen Machine", i: "🫧", need: 2, eff: { safety: -20 }, msg: "No oxygen! Safety −20" },
      { k: "crew", n: "Crew Heaters", i: "🔥", need: 2, eff: { safety: -10 }, msg: "Crew is freezing! Safety −10" },
      { k: "gheat", n: "Garden Heaters", i: "🌡️", need: 2, eff: { mission: -15 }, msg: "Plants freeze! Mission −15" },
      { k: "glight", n: "Garden Lights", i: "💡", need: 1, eff: { mission: -5 }, msg: "Plants in the dark. Mission −5" },
      { k: "radio", n: "Radio to Earth", i: "📡", need: 2, eff: {}, msg: "Earth can't hear us (no effect now)" },
    ];
    return new Promise((resolve) => {
      const alloc = DEV.map(() => 0);
      let time = B.time, ended = false, iv;
      const html = `<div class="head"><div><h3>MINI-TASK</h3><h1>Share the Power</h1></div><div class="tmr">⏱ <span class="t">${B.time}</span></div></div>
        <div class="pool">Power units left: <span class="slots"></span></div>
        <div class="power"></div><div class="say"></div><div class="btnrow"><button class="btn go lock">Lock in power ⚡</button></div>`;
      UI.card(html, [], {
        cls: "mg wide", onMount: (c, done) => {
          const pw = c.querySelector(".power"), pool = c.querySelector(".pool .slots"), say = c.querySelector(".say"), tEl = c.querySelector(".t");
          mgSay(say, "marcus", "We only have 6 units, and the machines need 9. We can't run everything. Think: what matters most?");
          const left = () => B.units - alloc.reduce((a, b) => a + b, 0);
          const draw = () => {
            pool.innerHTML = Array.from({ length: B.units }, (_, i) => `<div class="slot ${i < left() ? "on" : ""}" style="display:inline-block"></div>`).join("");
            pw.innerHTML = "";
            DEV.forEach((d, i) => {
              const full = alloc[i] >= d.need;
              const e = el("div", "dev" + (full ? " full" : ""), `<div class="di">${d.i}</div><div class="dn">${d.n}</div><div class="slots">${Array.from({ length: d.need }, (_, j) => `<div class="slot ${j < alloc[i] ? "on" : ""}"></div>`).join("")}</div><div class="eff">${full ? "✅ ON" : "needs " + d.need}</div>`);
              e.onclick = () => {
                if (ended) return;
                if (alloc[i] < d.need && left() > 0) { alloc[i]++; Sound.play("wire"); }
                else if (alloc[i] > 0) { alloc[i]--; Sound.play("click"); }
                else { Sound.play("error"); mgSay(say, "marcus", "No power left. Take some from another machine first."); }
                draw();
              };
              pw.appendChild(e);
            });
          };
          draw();
          const finish = (auto) => {
            if (ended) return; ended = true; clearInterval(iv);
            if (auto) { alloc.fill(0); alloc[0] = 2; alloc[1] = 2; alloc[2] = 2; draw(); mgSay(say, "marcus", "No time! I'll do it myself."); Sound.play("error"); }
            const total = { safety: 0, mission: 0, team: 0 }; const lost = [];
            DEV.forEach((d, i) => { if (alloc[i] < d.need) { for (const k in d.eff) total[k] += d.eff[k]; lost.push(d.msg); } });
            Sound.play("power"); G.power = 0.5;
            setTimeout(() => { done("ok"); Sound.setMood("tension"); if (total.safety || total.mission) meter(total, "⚡ " + lost.join(" · ")); else UI.toast("⚡ Power shared!"); resolve({ alloc, total, auto }); }, auto ? 2200 : 900);
          };
          c.querySelector(".lock").onclick = () => { if (left() > 0) { mgSay(say, "marcus", "We still have power left. Use every unit!"); Sound.play("error"); return; } finish(false); };
          iv = setInterval(() => { time -= 0.1; tEl.textContent = Math.ceil(time); if (time <= 0) finish(true); }, 100);
        },
      });
    });
  },

        },
      });

  },
};

// ---- intro.js ----
// =====================================================================
//  INTRO — timeline-driven cinematic (script-01-intro.md v2).
//  One master clock (Web Audio time). Each shot is a function that
//  draws itself at script time s. Narration files (if present) set the
//  real line lengths and the following shots shift to match.
// =====================================================================
const Intro = {
  out: null, og: null, B: null, bg: null, tmp: null,
  running: false, s: 0, last: 0, cues: [], narr: {}, shot: null, debug: false, dissolve: 0,
  pools: null,

  init() {
    this.out = mkCanvas(IW, IH); this.og = this.out.getContext("2d");
    this.B = mkCanvas(IW * 2, IH * 2); this.bg = this.B.getContext("2d");
    this.tmp = mkCanvas(IW, IH);
    this.pools = { smoke: new Pool(260), dust: new Pool(260), spark: new Pool(160), birds: new Pool(24), streak: new Pool(120), fx: new Pool(120) };
    this.debug = /[?&]debug=1/.test(location.search);
    this.planetCache = {};
    this.footprints = [];
  },

  // ------------------------------------------------------------ clock
  // Master clock = Web Audio time. Script time s = real seconds / PACE.
  now() { const c = Sound.ctx; return c && c.state === "running" ? c.currentTime : performance.now() / 1000; },
  get pace() { return INTRO_TIMING.PACE || 1; },

  // Narration plan in REAL seconds from the intro start. n1..n4a at their anchors (x PACE);
  // n4b = n4a end + gap, n4c = n4b end + gap. "end" = when the voice stops (trailing silence excluded).
  planNarration() {
    const N = INTRO_TIMING.narration, M = CONFIG.NARRATION_META || {}, P = this.pace, gaps = INTRO_TIMING.N4_GAPS || [0.8, 0.8];
    const plan = {};
    for (const k of ["N1", "N2", "N3", "N4A", "N4B", "N4C"]) {
      const n = N[k], f = this.narr[k] || {}, meta = M[k] || {};
      const dur = f.buf ? f.buf.duration : null;
      const lead = f.buf ? (meta.lead ?? 0) : 0, trail = f.buf ? (meta.trail ?? 0) : 0;
      const skip = lead > 0.15 ? lead : 0;            // trim leading silence at playback
      const voiceLen = f.buf ? dur - skip - trail : n.est; // how long the voice is heard
      let start;
      if (n.after) start = plan[n.after].end + gaps[n.after === "N4A" ? 0 : 1];
      else start = n.at * P - (lead > 0.15 ? 0 : lead); // voice starts on the anchor
      plan[k] = { k, start, end: start + voiceLen, skip, buf: f.buf || null, text: n.text, voiceLen };
    }
    this.plan = plan;
    // beats tied to the narration (converted to script seconds)
    const T = INTRO_TIMING, s = (w) => w / P;
    const Bt = Object.assign({}, T.beats);
    Bt.atDoor = s(plan.N4A.start);
    Bt.insideCut = Math.max(52.8, Math.min(56, s(plan.N4B.start - 0.8)));
    Bt.damonLook = Bt.insideCut + 1.0;
    Bt.starTouch = Math.max(Bt.damonLook + 1.3, s(plan.N4C.start));
    Bt.breath = Bt.starTouch + 1.5;
    const ft = s(plan.N4C.end) + T.finalWait;
    Bt.finalText = [ft, ft + T.finalType];
    Bt.dissolve = ft + T.finalType + T.finalHold;
    this.Bt = Bt;
    this.shots = T.shots.map((x) => ({ ...x }));
    this.shots[this.shots.length - 1].end = Bt.dissolve + T.dissolveLen;
    this.endT = this.shots[this.shots.length - 1].end;
  },

  // ------------------------------------------------------------ click-to-start
  showStart() {
    UI.clear(); Game.mode = "title"; Scenes.setShot("title"); $("#hud").classList.add("off");
    const d = el("div"); d.id = "title";
    d.innerHTML = `<div class="clickstart"><div class="cs-ico">🎧</div><button class="btn go" id="tStart">▶ Click to start</button><p>Best with sound on · about 1 minute intro</p>
      <div><button class="btn alt" id="tSet">⚙️ Settings</button><button class="btn alt" id="tSrc">🛰️ NASA Data</button></div></div>
      <small>A game about the real trade-offs of living on Mars · NASA Space Apps Challenge 2026 · Uses live space-weather data from NASA DONKI</small>`;
    UI.root.appendChild(d);
    d.querySelector("#tStart").onclick = async () => { Sound.init(); d.querySelector("#tStart").textContent = "Loading sounds…"; await this.start(); };
    d.querySelector("#tSet").onclick = () => { Sound.init(); UI.settings(); };
    d.querySelector("#tSrc").onclick = () => { Sound.init(); UI.credits(); };
  },

  async loadAudio() {
    const files = CONFIG.NARRATION_FILES || {}, ctx = Sound.ctx;
    const narr = Promise.all(["N1", "N2", "N3", "N4A", "N4B", "N4C"].map(async (k) => {
      this.narr[k] = {};
      const url = files[k]; if (!url || !ctx) return;
      try {
        const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 5000);
        const r = await fetch(url, { signal: ctl.signal }); clearTimeout(to);
        if (!r.ok) throw 0;
        this.narr[k] = { buf: await ctx.decodeAudioData(await r.arrayBuffer()) };
      } catch (e) { this.narr[k] = {}; }
    }));
    await Promise.all([narr, Sound.loadFiles(CONFIG.SFX_FILES, 5000)]);
  },

  async start(fromShot) {
    if (!this.out) this.init();
    SpaceWeather.load(); // never blocks the intro
    await this.loadAudio();
    this.planNarration();

  stormWall(g, x0, baseY, height, s) {
    const top = (x) => { const d = x - x0; if (d < 0) return baseY; const k = Math.min(1, d / 140); return baseY - height * (k * k * (3 - 2 * k)); };
    // body
    g.fillStyle = "#4a2414";
    for (let x = Math.max(0, Math.floor(x0)); x < IW; x += 2) { const ty = top(x) + 6; g.fillRect(x, Math.round(ty), 2, Math.round(baseY - ty + 2)); }
    // boiling billows along the edge
    for (let i = 0; i < 40; i++) {
      const x = x0 + i * 11 + Math.sin(s * 0.7 + i) * 2; if (x > IW + 20) break; if (x < -20) continue;
      const r = 8 + (i % 3) * 3 + Math.round(Math.sin(s * 2.2 + i * 1.7) * 1.5), y = top(x) + 6;
      pxCircle(g, x, y - 2, r, "#7a4426"); pxCircle(g, x + 1, y, r - 1, "#5e3018"); pxCircle(g, x + 2, y + 4, r - 2, "#4a2414");
    }
    // inner swirls
    for (let i = 0; i < 30; i++) { const x = x0 + 30 + rnd(i, 3) * 400, y = baseY - rnd(i, 4) * height * 0.8; if (x > IW || y < top(x) + 10) continue; g.fillStyle = "rgba(140,80,46,0.6)"; g.fillRect(Math.round(x + Math.sin(s + i) * 3), Math.round(y), 6, 1); }
  },
  // crew paths (world x) — hops toward the door, then the door positions
  crewX(s, id) {
    const Bt = this.Bt;
    const start = { lead: 150, layla: 118, marcus: 70, diego: 96 }[id];
    const door = { lead: 588, diego: 610, marcus: 634, layla: 556 }[id];
    let x = lerp(start, door, ease(seg(s, 41.0, Bt.atDoor)) * 0.15 + seg(s, 41.0, Bt.atDoor) * 0.85);
    if (id === "layla") { // catches up, stops at the glove moment, then follows
      const k = seg(s, 41.0, Bt.atDoor);
      x = lerp(start, door, k);
      if (between(s, 41.8, Bt.laylaGlove)) x = lerp(lerp(start, door, seg(41.8, 41.0, Bt.atDoor)), this.crewX(Bt.laylaGlove, "lead") - 14, seg(s, 41.8, Bt.laylaGlove));
      if (between(s, Bt.laylaGlove, 44.2)) x = this.crewX(Bt.laylaGlove, "lead") - 14 + (s < 43.5 ? (s - Bt.laylaGlove) * 30 : 30);
      if (s >= 44.2) x = lerp(this.crewX(Bt.laylaGlove, "lead") + 16, door, ease(seg(s, 44.2, Bt.atDoor + 0.6)));
    }
    if (s >= Bt.doorOpen + 0.3) { // walk into the airlock one by one
      const order = { lead: 0, diego: 1, marcus: 2, layla: 3 }[id], k = seg(s, Bt.doorOpen + 0.3 + order * 0.25, Bt.doorOpen + 0.8 + order * 0.25);
      x = lerp(x, 610, k);
    }
    return x;
  },
  drawCrewMember(g, s, q, id) {
    const Bt = this.Bt;
    if (s >= Bt.doorOpen + 0.3) { const order = { lead: 0, diego: 1, marcus: 2, layla: 3 }[id]; if (s > Bt.doorOpen + 0.8 + order * 0.25) return; }
    const x = this.crewX(s, id);
    const moving = s < Bt.atDoor + (id === "layla" ? 0.6 : 0) && !(id === "layla" && between(s, 43.5, 44.2));
    const cfg = { lead: { off: 0, h: 18 }, layla: { off: 0.4, h: 16 }, marcus: { off: 0.75, h: 15 }, diego: { off: 0.2, h: 24 } }[id];
    const cyc = 1.15, ph = ((s + cfg.off) % cyc) / cyc, airT = 0.9 / cyc;
    let air = 0;
    if (moving && ph < airT) air = Math.sin((ph / airT) * Math.PI);
    const y = 228 + ({ lead: 0, layla: -3, marcus: -6, diego: 3 }[id]) - Math.round(air * cfg.h);
    // landing puff + footprint + footstep
    const key = "_land_" + id, landed = moving && ph >= airT;
    if (landed && !this[key]) { for (let i = 0; i < 8; i++) this.pools.dust.spawn({ x: x + (Math.random() - 0.5) * 8, y: y - 1, vx: (Math.random() - 0.5) * 40, vy: -Math.random() * 14, life: 0.34, s: 2, c: Math.random() < 0.5 ? "#e0a96d" : "#c88a58", g: 30 }); this.footprints.push({ x, y }); if (this.footprints.length > 80) this.footprints.shift(); if (id === "lead") Sound.play("step", "sand"); }
    this[key] = landed;
    const o = { f: 1, look: 1, step: moving ? s * 9 : 0, air, t: s, tilt: 0 };
    if (id === "lead") {
      o.tilt = 1; o.band = 0.55 + seg(s, 41, 52) * 0.4; // storm in the visor he never looks at
      if (between(s, Bt.laylaGlove, Bt.laylaGlove + 1.0)) o.gloveCheck = true;
      if (between(s, Bt.laylaGlove + 0.4, Bt.laylaGlove + 0.9)) { o.arm = "waveoff"; o.armK = Math.sin(seg(s, Bt.laylaGlove + 0.4, Bt.laylaGlove + 0.9) * Math.PI); }
    }
    if (id === "layla") {
      if (between(s, Bt.laylaGlove, Bt.laylaGlove + 1.0)) { o.arm = "point"; o.look = 1; o.tilt = 2; }
      if (between(s, 43.5, 44.2)) { o.tilt = -1; o.look = 1; o.step = 0; } // stops, head tilted
      if (s >= Bt.atDoor) { o.look = 1; o.tilt = -3; } // looks at the dome
    }
    if (id === "marcus") {
      o.tilt = -3; o.arm = "tablet"; // watching the storm
      if (between(s, Bt.laylaGlove + 0.3, Bt.laylaGlove + 0.7)) o.tilt = 1;
      if (s >= Bt.atDoor) { o.look = -1; o.tilt = 0; }
    }
    if (id === "diego") {
      o.look = ((q / 0.6) | 0) % 2 ? 1 : -1;
      if (((s / 2.3) | 0) % 2 === 0 && moving) o.arm = "wave";
      if (s >= Bt.atDoor) o.look = ((q / 0.5) | 0) % 2 ? -1 : 1;
    }
    if (o.arm === "tablet") o.arm = undefined;
    figHelmet(g, id, x, y, o);
  },

  // ================================================================ SHOT 7 — control room
  shot_control(g, s, ls, dt, t) {
    const Bt = this.Bt, q = this.q(s), b = this.bg;
    if (s < Bt.insideCut) {
      // push-in on a round window: dusty glass, the storm reflected
      b.fillStyle = "#cfcac0"; b.fillRect(0, 0, IW, IH);
      for (let y = 0; y < IH; y += 34) { b.fillStyle = "#b8b2a6"; b.fillRect(0, y, IW, 1); } for (let x = 0; x < IW; x += 70) { b.fillStyle = "#b8b2a6"; b.fillRect(x, 0, 1, IH); }
      for (let i = 0; i < 40; i++) { b.fillStyle = "#8a8478"; b.fillRect(Math.round(rnd(i, 1) * IW), Math.round(rnd(i, 2) * IH), 1, 1); }
      pxCircle(b, 240, 135, 82, "#6a6e7a"); pxCircle(b, 240, 135, 76, "#8b93a6"); pxCircle(b, 240, 135, 70, "#2a1e1a");
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; b.fillStyle = "#4a4e5a"; b.fillRect(Math.round(240 + Math.cos(a) * 79) - 1, Math.round(135 + Math.sin(a) * 79) - 1, 3, 3); }
      // reflected storm
      b.save(); b.beginPath(); b.arc(240, 135, 70, 0, 7); b.clip();
      const sk = b.createLinearGradient(0, 65, 0, 205); sk.addColorStop(0, "#c8955a"); sk.addColorStop(1, "#7a4a2a"); b.fillStyle = sk; b.fillRect(170, 65, 140, 140);
      b.fillStyle = "#a25a34"; b.fillRect(170, 168, 140, 40);
      this.stormWall(b, 150, 170, 70, s);
      b.fillStyle = "rgba(200,150,110,0.35)"; b.fillRect(170, 65, 140, 140);
      for (let i = 0; i < 70; i++) { b.fillStyle = "rgba(255,230,200,0.45)"; b.fillRect(170 + Math.round(rnd(i, 7) * 140), 65 + Math.round(rnd(i, 8) * 140), 1, 1); }
      b.fillStyle = "rgba(255,255,255,0.35)"; for (let i = 0; i < 5; i++) b.fillRect(196 + i * 3, 92 + i * 3, 22, 1);
      b.restore();
      this.cam(g, 240, 135, lerp(1, 1.35, ease(seg(s, 52.0, Bt.insideCut))));
      if (s < 52.4) { g.fillStyle = `rgba(255,184,74,${1 - seg(s, 52.0, 52.4)})`; g.fillRect(0, 0, IW, IH); }
      return;
    }
    // inside: same room as shot 1, calm and warm
    this.drawControlRoom(b, s, true);
    const lvl = (() => { const SW = SpaceWeather; if (SW.status !== "live" && SW.status !== "archived") return "...";  const r = SW.risk(); return ({ quiet: "LOW", M: "MEDIUM", X: "HIGH" })[r] + (SW.status === "archived" ? " (ARCHIVED)" : ""); })();
    b.fillStyle = "#0e2a24"; b.fillRect(152, 112, 176, 20); pxText(b, "SOLAR ACTIVITY TODAY:", 156, 114, 1, "#ffd34a"); pxText(b, lvl, 156, 123, 1, "#ffffff");
    b.save(); b.globalCompositeOperation = "lighter"; const wg = b.createRadialGradient(240, 60, 10, 240, 120, 260); wg.addColorStop(0, "rgba(255,226,180,0.2)"); wg.addColorStop(1, "rgba(0,0,0,0)"); b.fillStyle = wg; b.fillRect(0, 0, IW, IH); b.restore();
    bustBack(b, "marcus", 338, 198, { breathe: this.breathe(q, 0.6) });
    // Damon: three-quarter view, hands on the console edge
    let turn = 0.25, gx = 0.6, gy = 0, brow = "neutral", arm = "console", armK = 1, breathe = this.breathe(q), mouth = "closed";
    if (s >= Bt.damonLook && s < Bt.damonLook + 1.2) { turn = 0.6; gx = 1; brow = "worry"; }
    if (s >= Bt.starTouch) { arm = "star"; armK = ease(seg(s, Bt.starTouch, Bt.starTouch + 0.8)); gx = 0.2; }
    if (s >= Bt.breath) { const k = seg(s, Bt.breath, Bt.breath + 0.8) - seg(s, Bt.breath + 1.4, Bt.breath + 2.2); breathe = Math.round(k * 2); if (between(s, Bt.breath + 0.1, Bt.breath + 0.8)) gy = 1; if (s >= Bt.breath + 0.8) { brow = "firm"; gy = 0; gx = 0; } }
    const bodyTurn = s >= Bt.damonLook + 2 / 12 && s < Bt.damonLook + 1.2 + 2 / 12 ? 0.6 : 0.25; // body follows the head 2 frames later
    bust(b, "lead", 160, 240, { f: 1, turn, bodyTurn, gx, gy, brow, mouth, arm, armK, star: true, glint: s >= Bt.starTouch + 0.8 && s < Bt.starTouch + 1.05 ? 1 : 0, breathe, blink: s < Bt.damonLook ? this.blink(q, 0.3, 3.6) : s > Bt.breath + 1 ? this.blink(q, 0.9, 4) : 0 });
    // console rail in front
    b.fillStyle = "#3c4258"; b.fillRect(0, 252, IW, 18); b.fillStyle = "#5a6280"; b.fillRect(0, 252, IW, 2);
    for (let x = 20; x < IW; x += 14) { b.fillStyle = rnd(x, (s * 2) | 0) > 0.5 ? "#5dff8a" : "#1a1d2a"; b.fillRect(x, 260, 3, 2); }
    const z = lerp(1, 1.08, ease(seg(s, Bt.insideCut, 63.5)));
    this.cam(g, 236, 146, z);
    // final line
    if (s >= Bt.finalText[0]) { g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(0, 20, IW, 30); typeText(g, "final", INTRO_TIMING.texts.final, Math.round((IW - textW(INTRO_TIMING.texts.final, 2)) / 2), 28, s, Bt.finalText[0], INTRO_TIMING.texts.final.length / (Bt.finalText[1] - Bt.finalText[0]), 2, "#e0a96d", "#000"); }
    // pixel dither dissolve into the top-down game room
    if (s >= Bt.dissolve) {
      const k = seg(s, Bt.dissolve, this.endT);
      renderWorld(Game.lg, t, dt);
      const tg = this.tmp.getContext("2d"); tg.imageSmoothingEnabled = false; tg.globalCompositeOperation = "source-over"; tg.clearRect(0, 0, IW, IH);
      tg.drawImage(Game.low, 0, 0, IW, IH);
      tg.globalCompositeOperation = "destination-in"; tg.drawImage(ditherMask(k * 16), 0, 0);
      g.drawImage(this.tmp, 0, 0);
    }
  },
};

// smooth value noise used by the planets
const _ng = Array.from({ length: 64 * 32 }, (_, i) => hash(i % 64, (i / 64) | 0));
function noise2(x, y) {
  let tot = 0, amp = 1, norm = 0;
  for (let o = 0; o < 3; o++) {
    const fx = (x * 64) / (Math.PI * 2) * (1 << o), fy = ((y + Math.PI / 2) / Math.PI) * 32 * (1 << o);
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
    const v = (a, b) => _ng[((((b % 32) + 32) % 32) * 64) + (((a % 64) + 64) % 64)];
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const n = lerp(lerp(v(x0, y0), v(x0 + 1, y0), sx), lerp(v(x0, y0 + 1), v(x0 + 1, y0 + 1), sx), sy);
    tot += n * amp; norm += amp; amp *= 0.5;
  }
  return tot / norm;
}
